name: Check & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 语法检查
        run: |
          for f in app/*.js server/server.js server/public/*.js; do
            node --check "$f" || exit 1
          done
          echo "syntax ok"

      - name: 密钥泄漏扫描
        run: |
          if grep -rIn "sk-ws-H\." app server tools docs README.md 2>/dev/null; then
            echo "::error::发现疑似模型密钥内容"
            exit 1
          fi
          echo "no leaked keys"

      - name: 部署说明
        run: |
          echo "检查通过。部署由本机守护 tools/auto-deploy-watch.py 自动完成："
          echo "Trae 部署服务端校验完整 IDE 会话上下文，runner 环境发出的请求会被拒绝(SERVICE_401)，"
          echo "只有 Trae IDE 派生进程能通过认证，故部署守护常驻本机，轮询新提交后自动发布。"
