name: Check & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 语法检查
        run: |
          for f in app/*.js server/server.js server/public/*.js; do
            node --check "$f" || exit 1
          done
          echo "syntax ok"

      - name: 密钥泄漏扫描
        run: |
          if grep -rIn "sk-ws-H\." app server tools docs README.md 2>/dev/null; then
            echo "::error::发现疑似模型密钥内容"
            exit 1
          fi
          echo "no leaked keys"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: [self-hosted, shiyi-deploy]
    env:
      TRAE_JWT: ${{ secrets.TRAE_JWT }}
      SHIYI_API_KEY: ${{ secrets.SHIYI_API_KEY }}
      TRAE_PROJECT_ID: ${{ secrets.TRAE_PROJECT_ID }}
      TRAE_CHAT_SESSION_ID: ${{ secrets.TRAE_SESSION_ID }}
      TRAE_LANE: prod
      TRAE_REGION: cn
    steps:
      - uses: actions/checkout@v4

      - name: 部署到 Trae 站点（本机 runner）
        shell: powershell
        run: |
          # 代理仅用于 runner 连 GitHub；部署 CLI 必须直连国内服务
          $env:HTTP_PROXY = $null; $env:HTTPS_PROXY = $null
          $env:http_proxy = $null; $env:https_proxy = $null
          # 宿主注入的消息 ID 会被服务端校验拒绝（SERVICE_401），显式移除
          $env:TRAE_USER_MESSAGE_ID = $null

          $bin = 'D:\actions-runner\tools\trae-deploy.exe'
          $tmp = [System.IO.Path]::GetTempPath()

          $tokPath = Join-Path $tmp "shiyi-jwt-$env:GITHUB_RUN_ID"
          [System.IO.File]::WriteAllText($tokPath, $env:TRAE_JWT)
          $env:TRAE_DEPLOYMENT_TOKEN_PATH = $tokPath

          # 前端构建拷贝（与原 rsync app/ -> server/public/ 等价）
          Get-ChildItem server\public -ErrorAction Stop | Remove-Item -Recurse -Force -ErrorAction Stop
          Copy-Item app\* server\public\ -Recurse -Force -ErrorAction Stop
          if (-not (Test-Path server\public\index.html)) { throw "public/index.html 缺失" }

          # 打包（source-dir 必须位于系统临时目录下）
          $stage = Join-Path $tmp ("shiyi-deploy-" + $env:GITHUB_RUN_ID)
          if (Test-Path $stage) { Remove-Item $stage -Recurse -Force -ErrorAction Stop }
          New-Item -ItemType Directory -Path $stage -ErrorAction Stop | Out-Null
          Copy-Item server\* $stage\ -Recurse -Force -ErrorAction Stop

          $cfg = @{
            schema_version = 1
            build = @{ runtime_key = 'nodejs20'; build_script = 'build.sh'; output_dir = 'dist'; environment = @{}; timeout_seconds = 3600 }
            runtime = @{ runtime_key = 'nodejs20'; start_script = 'run.sh'; port = 8000; environment = @{ PORT = '8000'; SHIYI_API_KEY = $env:SHIYI_API_KEY; SHIYI_MODEL = 'deepseek-v4.1-flash'; SHIYI_BASE_URL = 'https://ws-87k3b558xqetd2mn.cn-beijing.maas.aliyuncs.com/compatible-mode/v1' } }
          }
          [System.IO.File]::WriteAllText((Join-Path $stage 'exec-config.json'), ($cfg | ConvertTo-Json -Depth 10))

          $out = & $bin deployments create --site-id 37ljkvjqby7ib89amxv --title "CI 发布 $env:GITHUB_SHA" --type function-web --source-dir $stage --execution-config "$stage\exec-config.json" --app-tags 289 2>$null
          $jsonLine = $out | Where-Object { $_ -like '{"data"*' } | Select-Object -First 1
          if (-not $jsonLine) { $out | ForEach-Object { Write-Host $_ }; throw "create 无 JSON 响应" }
          $resp = $jsonLine | ConvertFrom-Json
          if (-not $resp.ok) { Write-Host $jsonLine; throw "create 失败: $($resp.error.code) $($resp.error.message)" }
          $depId = $resp.data.deployment_id
          Write-Host "deploying $depId"

          $wout = & $bin deployments wait --deployment-id $depId --timeout-seconds 300 2>$null
          $wjson = $wout | Where-Object { $_ -like '{"data"*' } | Select-Object -First 1
          if (-not $wjson) { $wout | ForEach-Object { Write-Host $_ }; throw "wait 无 JSON 响应" }
          $wresp = $wjson | ConvertFrom-Json
          if (-not $wresp.ok) { Write-Host $wjson; throw "wait 失败" }
          Write-Host ("deployment status=" + $wresp.data.deployment.status + " progress=" + $wresp.data.deployment.progress_percent)

          $code = (Invoke-WebRequest -Uri 'https://37ljkvjqby7ib89amxv.traesite.cn/' -UseBasicParsing -TimeoutSec 60 -ErrorAction Stop).StatusCode
          if ($code -ne 200) { throw "站点校验失败 HTTP $code" }
          Write-Host "site check: HTTP $code"
